name: Build Apache static site

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static SPA
        run: bun run build

      - name: Prepare Apache files
        shell: bash
        run: |
          set -euo pipefail
          output="dist/client"
          test -f "$output/index.html"
          test -f "$output/.htaccess"

      - name: Upload Apache site artifact
        uses: actions/upload-artifact@v4
        with:
          name: health-ok-hospitals-apache
          path: dist/client/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30